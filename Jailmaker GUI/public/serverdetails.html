<!DOCTYPE html>
<html>
<head>
  <title>Server Details</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
</head>
<body>
  <div class="container">
    <div class="page-header" style="justify-content:space-between;">
      <div class="brand" style="display:flex;align-items:center;gap:12px;">
        <img src="truenas.png" alt="App Icon" class="app-icon-left">
        <h1 style="margin:0;font-size:1.25rem;">Server Details</h1>
      </div>
      <!-- tiny dark/light toggle -->
      <button class="theme-toggle" id="themeToggle" title="Toggle theme">
        <span id="themeIcon">🌙</span><span id="themeLabel">Dark</span>
      </button>
    </div>

    <form id="serverDetailsForm">
      <div class="form-row">
        <label for="serverIp">Server IP/DNS</label>
        <input id="serverIp" required>
      </div>

      <div class="form-row">
        <label for="serverPort">Port</label>
        <input id="serverPort" type="number" value="22" required>
      </div>

      <div class="form-row">
        <label for="serverUser">User</label>
        <input id="serverUser" required>
      </div>

      <div class="form-row">
        <label for="serverPassword">Password</label>
        <input id="serverPassword" type="password" required>
      </div>

      <button type="submit">Save & Next</button>
    </form>
    <div id="response"></div>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
