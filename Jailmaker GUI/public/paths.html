<!DOCTYPE html>
<html>
<head>
  <title>Jailmaker Paths</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
</head>
<body>
  <div class="container">
    <div class="page-header" style="justify-content:space-between;">
      <div class="brand" style="display:flex;align-items:center;gap:12px;">
        <img src="truenas.png" alt="App Icon" class="app-icon-left">
        <h1 style="margin:0;font-size:1.25rem;">Define Jailmaker Paths</h1>
      </div>
      <!-- tiny dark/light toggle -->
      <button class="theme-toggle" id="themeToggle" title="Toggle theme">
        <span id="themeIcon">🌙</span><span id="themeLabel">Dark</span>
      </button>
    </div>

    <form id="pathsForm">
      <div class="form-row">
        <label for="path1">Path 1</label>
        <input id="path1" placeholder="/mnt/volume/jails/"/>
      </div>
      <div class="form-row">
        <label for="path2">Path 2</label>
        <input id="path2"/>
      </div>
      <div class="form-row">
        <label for="path3">Path 3</label>
        <input id="path3"/>
      </div>
      <button type="submit">Save & Finish</button>
    </form>
    <div id="response"></div>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
